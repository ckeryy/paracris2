<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista de Imagen</title>
    <!-- Importación de fuentes desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fondo amarillo claro con degradado suave */
            background: radial-gradient(circle at center, #fef9c3 0%, #fef08a 60%, #fde047 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Ventana emergente inicial */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            transition: opacity 0.5s ease;
            overflow-y: auto;
        }

        .modal-content {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 32px;
            max-width: 900px;
            width: 95%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            border: 6px solid #fde047;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-title {
            font-family: 'Pacifico', cursive;
            color: #ca8a04;
            font-size: clamp(3rem, 7vw, 4.8rem);
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .modal-phrase {
            color: #334155;
            font-size: clamp(1.3rem, 3.5vw, 2rem);
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .modal-btn {
            background: #eab308;
            color: #ffffff;
            border: none;
            padding: 22px 60px;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(234, 179, 8, 0.5);
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-btn:hover {
            background: #ca8a04;
            transform: scale(1.06);
        }

        /* Contenedor ampliado para el video debajo de la ventana */
        .video-container {
            margin-top: 30px;
            max-width: 800px;
            width: 95%;
            position: relative;
            opacity: 0;
            animation: floatFadeIn 1.2s ease-out 0.3s forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-player {
            width: 100%;
            max-height: 480px;
            border-radius: 28px;
            outline: none;
            /* Desvanecimiento suave en los bordes */
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        /* Texto debajo del video */
        .video-caption {
            color: #f8fafc;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-style: italic;
            font-weight: 400;
            margin-top: 15px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
            opacity: 0.9;
        }

        /* Contenedor principal de la imagen (oculto al inicio) */
        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
            display: none;
            animation: fadeIn 0.8s ease-in-out forwards;
            z-index: 10;
        }

        .heading-title {
            font-family: 'Pacifico', cursive;
            color: #1e293b;
            font-size: clamp(3.5rem, 12vw, 9rem);
            margin-top: -30px;
            margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(255, 255, 255, 0.8);
            line-height: 1.1;
            white-space: nowrap;
        }

        .responsive-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: block;
            margin: 0 auto;
        }

        /* Texto animado de máquina de escribir debajo de la imagen */
        .typing-container {
            margin-top: 25px;
            display: inline-block;
        }

        .typing-text {
            font-family: 'Pacifico', cursive;
            color: #1e293b;
            font-size: clamp(2rem, 5vw, 3.8rem);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
            border-right: 3px solid #1e293b;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            width: 0;
        }

        /* Animación de escritura */
        .start-typing {
            animation: typing 3s steps(22, end) forwards, blink 0.75s infinite;
        }

        /* Estilos para los pétalos de flores */
        .petal {
            position: fixed;
            top: -10%;
            background: #fef08a;
            border-radius: 150px 0 150px 0;
            opacity: 0.8;
            pointer-events: none;
            z-index: 5;
            animation: fall linear forwards;
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes floatFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #1e293b; }
        }
    </style>
</head>
<body>

    <!-- Ventana emergente inicial -->
    <div class="modal-overlay" id="welcomeModal">
        <div class="modal-content">
            <h2 class="modal-title">¡Feliz Inicio de la Primavera!</h2>
            <p class="modal-phrase">
                "Que este 21 de septiembre florezcan tus mejores momentos, se renueven tus energías y el sol te acompañe siempre en cada paso."
            </p>
            <button class="modal-btn" onclick="revelarRegalo()">Ver regalo</button>
        </div>

        <!-- Video ampliado debajo del cuadro modal -->
        <div class="video-container">
            <video class="video-player" autoplay loop muted playsinline>
                <source src="https://github.com/ckeryy/cris/raw/refs/heads/main/VID-20260921-WA0003.mp4" type="video/mp4">
            </video>
            <p class="video-caption">(farmeando aura)</p>
        </div>
    </div>

    <!-- Contenido con el título, la imagen y la animación de texto -->
    <div class="container" id="giftContent">
        <h1 class="heading-title">Para ti bro</h1>
        <img src="https://raw.githubusercontent.com/ckeryy/cris/refs/heads/main/db9c1f34-8986-494e-a5dc-311db0047e69.jpeg" 
             alt="Imagen ampliada" 
             class="responsive-img">
        
        <div class="typing-container">
            <p class="typing-text" id="typewriterText">te kiero mucho amiko</p>
        </div>
    </div>

    <script>
        function revelarRegalo() {
            // Reproduce un efecto de sonido alegre al hacer clic
            playSuccessSound();

            // Transición suave para ocultar la ventana
            const modal = document.getElementById('welcomeModal');
            modal.style.opacity = '0';
            
            setTimeout(() => {
                modal.style.display = 'none';
                document.getElementById('giftContent').style.display = 'block';
                
                // Iniciar animación de escritura
                document.getElementById('typewriterText').classList.add('start-typing');
                
                // Iniciar lluvia de pétalos
                crearLluviaDePetalos();
            }, 500);
        }

        // Genera un tono musical mediante Web Audio API
        function playSuccessSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + index * 0.1);
                    osc.stop(audioCtx.currentTime + index * 0.1 + 0.3);
                });
            } catch (e) {
                console.log('Audio no soportado');
            }
        }

        // Generación dinámica de pétalos cayendo
        function crearLluviaDePetalos() {
            const colores = ['#fef08a', '#fde047', '#fef9c3', '#facc15', '#ffffff'];
            
            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                
                const size = Math.random() * 15 + 10;
                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.5}px`;
                
                petal.style.left = Math.random() * 100 + 'vw';
                
                petal.style.background = colores[Math.floor(Math.random() * colores.length)];
                petal.style.animationDuration = Math.random() * 3 + 3 + 's';
                
                document.body.appendChild(petal);

                setTimeout(() => {
                    petal.remove();
                }, 6000);
            }, 200);
        }
    </script>

</body>
</html>
